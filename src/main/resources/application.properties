# src/main/resources/application.properties
# IMPORTANT: never hardcode server.port here.
# application.properties wins over application.yml, and Cloud Run requires the
# app to listen on $PORT. The port is defined in application.yml as ${PORT:8080}.

# Optional JWT secret for demo; override via env var ONBOARDING_JWT_SECRET in real runs
onboarding.jwt.secret=${ONBOARDING_JWT_SECRET:change-me-for-local-demo}

# Active profile comes from the environment (Cloud Run sets SPRING_PROFILES_ACTIVE=cloud)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

