spring:
  application:
    name: ikano-onboarding-platform

  datasource:
    url: jdbc:h2:mem:onboarding;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

  thymeleaf:
    cache: false

  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    com.ikano: DEBUG

---
# Cloud Run profile: no external database, no dev tooling, quieter logs
spring:
  config:
    activate:
      on-profile: cloud

  datasource:
    url: jdbc:h2:mem:onboarding;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update

  h2:
    console:
      enabled: false

  thymeleaf:
    cache: true

logging:
  level:
    root: INFO
    com.ikano: INFO
