spring:
  application:
    name: ikano-onboarding-platform
  datasource:
    url: jdbc:h2:file:./data/onboarding-dev;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info

# JWT signing secret - MUST be overridden via env var in any real deployment.
# Left blank here on purpose: SessionJwtService generates a random per-boot
# key if this is empty, which is fine for local/demo use but means tokens
# do not survive an app restart.
onboarding:
  jwt:
    secret: ${ONBOARDING_JWT_SECRET:}

