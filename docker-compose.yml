version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: ikano-postgres
    environment:
      POSTGRES_DB: onboarding_dev
      POSTGRES_USER: onboard
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onboard -d onboarding_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: ikano-onboarding-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/onboarding_dev
      SPRING_DATASOURCE_USERNAME: onboard
      SPRING_DATASOURCE_PASSWORD: change_me
      SERVER_PORT: 8080
    ports:
      - "8081:8080"

volumes:
  pgdata:

