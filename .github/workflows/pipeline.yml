name: pipeline

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  ARTIFACT_NAME: onboarding-jar
  GCP_PROJECT_ID: ikano-onboarding
  GCP_REGION: europe-west4
  AR_REPOSITORY: ikano-onboarding
  IMAGE_NAME: onboarding
  CLOUD_RUN_SERVICE: ikano-onboarding

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build, test & package
        run: mvn -B verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload JAR
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: target/*.jar
          retention-days: 7

  deploy:
    name: Deploy to Google Cloud Run
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    timeout-minutes: 20
    environment:
      name: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Download built JAR
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: target/

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Resolve image reference
        id: img
        run: |
          IMAGE_REF="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}/${IMAGE_NAME}"
          echo "IMAGE=${IMAGE_REF}" >> "$GITHUB_ENV"
          echo "image=${IMAGE_REF}" >> "$GITHUB_OUTPUT"

      - name: Build & push image
        run: |
          ls -l target/*.jar
          docker build \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"

      - name: Deploy to Cloud Run
        id: run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ steps.img.outputs.image }}:${{ github.sha }}
          flags: >-
            --allow-unauthenticated
            --port=8080
            --memory=1Gi
            --cpu=1
            --cpu-boost
            --min-instances=0
            --max-instances=2
            --timeout=300

      - name: Smoke test
        run: curl -fsS "${{ steps.run.outputs.url }}/actuator/health"

      - name: Summary
        run: echo "Deployed ${{ steps.img.outputs.image }}:${{ github.sha }} → ${{ steps.run.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
