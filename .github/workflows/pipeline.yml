name: pipeline

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch; never cancel a master deploy
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Least privilege by default; jobs elevate only what they need
permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  ARTIFACT_NAME: onboarding-jar
  GCP_PROJECT_ID: wired-torus-426414-u8
  GCP_REGION: europe-north1
  AR_REPOSITORY: ikano-onboarding
  IMAGE_NAME: onboarding
  CLOUD_RUN_SERVICE: ikano-onboarding

jobs:
  # ─────────────────────────── Stage 1: build & test ───────────────────────────
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # verify = compile → test → package, so the JAR is produced here once
      - name: Build, test & package
        run: mvn -B verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload JAR
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: target/*.jar
          retention-days: 7

  # ─────────────────────────── Stage 2: deploy (master only) ───────────────────
  deploy:
    name: Deploy to Google Cloud Run
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    timeout-minutes: 20
    environment:
      name: production            # add required reviewers in Settings → Environments
    permissions:
      contents: read
    env:
      IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.IMAGE_NAME }}
    steps:
      - uses: actions/checkout@v5

      # Promote the exact artifact that was tested – never rebuild
      - name: Download built JAR
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: target/

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # Immutable tag = commit SHA (traceability); 'latest' is convenience only
      - name: Build & push image
        run: |
          docker build \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"

      - name: Deploy to Cloud Run
        id: run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          flags: --allow-unauthenticated --port=8080 --memory=512Mi --min-instances=0 --max-instances=2

      - name: Smoke test
        run: curl -fsS "${{ steps.run.outputs.url }}/actuator/health" || curl -fsS "${{ steps.run.outputs.url }}/"

      - name: Summary
        run: echo "Deployed ${{ env.IMAGE }}:${{ github.sha }} → ${{ steps.run.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
