name: pipeline

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch; never cancel a master deploy
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Least privilege by default; jobs elevate only what they need
permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  ARTIFACT_NAME: onboarding-jar

jobs:
  # ─────────────────────────── Stage 1: build & test ───────────────────────────
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # verify = compile → test → package, so the JAR is produced here once
      - name: Build, test & package
        run: mvn -B verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload JAR
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: target/*.jar
          retention-days: 7

  # ─────────────────────────── Stage 2: security ───────────────────────────────
  security:
    name: Security scans
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write   # upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@v5

      - name: Install Trivy
        env:
          TRIVY_VERSION: v0.58.1
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin "$TRIVY_VERSION"
          trivy --version

      # Covers Maven dependencies (pom.xml), IaC/config misconfigurations and leaked secrets
      - name: Dependency, config & secret scan (Trivy)
        run: |
          trivy fs . \
            --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL \
            --format sarif \
            --output trivy.sarif \
            --exit-code 0

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif

  # ─────────────────────────── Stage 3: deploy (master only) ───────────────────
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    timeout-minutes: 20
    environment:
      name: production            # add required reviewers in Settings → Environments
    permissions:
      contents: read
      id-token: write             # OIDC – no long-lived AWS keys
    steps:
      - uses: actions/checkout@v5

      # Promote the exact artifact that was tested and scanned – never rebuild
      - name: Download built JAR
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: target/

      - name: Check AWS configuration
        id: cfg
        run: |
          if [ -z "${{ vars.AWS_ROLE_ARN }}" ]; then
            echo "::notice::AWS_ROLE_ARN not configured – skipping deploy"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.cfg.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy
        if: steps.cfg.outputs.enabled == 'true'
        run: ./deploy/deploy.sh
