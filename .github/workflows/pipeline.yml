name: pipeline

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch; never cancel a master deploy
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Least privilege by default; jobs elevate only what they need
permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  ARTIFACT_NAME: onboarding-jar

jobs:
  # ─────────────────────────── Stage 1: build & test ───────────────────────────
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Unit + integration tests
        run: mvn -B verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Package (tests already run)
        run: mvn -B -DskipTests package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: target/*.jar
          retention-days: 7

  # ─────────────────────────── Stage 2: security ───────────────────────────────
  security:
    name: Security scans
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write   # upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Move the steps from your existing security.yml here, e.g.:
      - name: Dependency vulnerability scan (OWASP)
        run: mvn -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7

      - name: Filesystem / config scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif

  # ─────────────────────────── Stage 3: deploy (master only) ───────────────────
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    timeout-minutes: 20
    environment:
      name: production            # add required reviewers in Settings → Environments
    permissions:
      contents: read
      id-token: write             # OIDC – no long-lived AWS keys
    steps:
      - uses: actions/checkout@v5

      - name: Download built JAR
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: target/

      - name: Check AWS configuration
        id: cfg
        run: |
          if [ -z "${{ vars.AWS_ROLE_ARN }}" ]; then
            echo "::notice::AWS_ROLE_ARN not configured – skipping deploy"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.cfg.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Move the actual deploy steps from your existing deploy-aws.yml here
      - name: Deploy
        if: steps.cfg.outputs.enabled == 'true'
        run: ./deploy/deploy.sh
